<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop</title>
    <style>
        .parent{

            height: 100vh;

            justify-content: center;
        }
        .card{
            height: 500px;
            width: 500px;
            background-color: rgb(64, 64, 74);
        }

        }
        .card h4{
            color: rgb(168, 168, 185);
            font-size: 2vw;
        }
        .but_parent{

            justify-content: center;
        }
        .okk{
            color: rgb(120, 148, 139);

        }
    </style>
</head>
<body>

               </div>
        </div>
 </div>

 </script>
</body>
</html>
