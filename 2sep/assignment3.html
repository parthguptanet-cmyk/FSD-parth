            <p>Journey date: <input type="date" id=""></p>

        <div class="header2">
            <h2>Bus Information</h2>
        </div>
        <div class="form2">
            <input type="radio" id="ac" value="AC BUS">
            <label for="ac">AC BUS -$200</label>
            <br>
            <input type="radio" id="non" value="non ac">
            <label for="non">NON AC BUS -$150</label>

        </div>
         <div class="button1">
